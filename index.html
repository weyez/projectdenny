<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akbarloh Browser</title>
    <style>
      :root {
        --blue: #49a8ff;
        --white: #ffffff;
        --soft-blue: #dff1ff;
        --text: #0f4f88;
        --shadow: 0 20px 45px rgba(14, 78, 145, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--blue) 0%, #9fd3ff 45%, var(--white) 100%);
      }

      .browser {
        width: min(94vw, 1000px);
        height: min(84vh, 680px);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: var(--shadow);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.74);
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .browser-top {
        padding: 14px;
        display: grid;
        gap: 10px;
        background: linear-gradient(180deg, rgba(73, 168, 255, 0.24), rgba(255, 255, 255, 0.95));
        border-bottom: 1px solid rgba(55, 137, 218, 0.18);
      }

      .browser-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .dots {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #8ec7ff;
      }

      .brand {
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.86rem;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      #urlInput {
        width: 100%;
        height: 40px;
        border-radius: 999px;
        border: 1px solid rgba(80, 155, 230, 0.35);
        padding: 0 16px;
        font-size: 0.98rem;
        outline: none;
      }

      #urlInput:focus {
        border-color: #3d9df3;
        box-shadow: 0 0 0 3px rgba(61, 157, 243, 0.2);
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 0 20px;
        background: linear-gradient(135deg, #2d8ee7, #64bbff);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      .browser-content {
        background: linear-gradient(160deg, rgba(73, 168, 255, 0.11), rgba(255, 255, 255, 0.95));
        padding: 14px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid rgba(73, 168, 255, 0.2);
        border-radius: 14px;
        background: var(--white);
      }

      .fallback {
        display: grid;
        place-items: center;
        height: 100%;
        text-align: center;
        color: var(--text);
        border: 1px dashed rgba(73, 168, 255, 0.35);
        border-radius: 14px;
        background: linear-gradient(180deg, #f5fbff, var(--soft-blue));
      }

      .fallback h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 7vw, 4rem);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="browser" aria-label="Interactive browser mockup">
      <div class="browser-top">
        <div class="browser-row">
          <div class="dots" aria-hidden="true">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="brand">Akbarloh</div>
        </div>

        <form class="controls" id="browserForm">
          <input
            id="urlInput"
            type="text"
            placeholder="Введи адрес, например: https://example.com"
            aria-label="Адрес сайта"
          />
          <button type="submit">Открыть</button>
        </form>
      </div>

      <section class="browser-content">
        <iframe id="siteFrame" title="Browser content"></iframe>
        <div class="fallback" id="fallback">
          <div>
            <h1>Akbarloh</h1>
            <p>Теперь можно вводить ссылку сверху и нажимать «Открыть».</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('browserForm');
      const input = document.getElementById('urlInput');
      const frame = document.getElementById('siteFrame');
      const fallback = document.getElementById('fallback');

      function normalizeUrl(value) {
        const trimmed = value.trim();
        if (!trimmed) return '';
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        return `https://${trimmed}`;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const url = normalizeUrl(input.value);
        if (!url) {
          fallback.style.display = 'grid';
          frame.style.display = 'none';
          return;
        }

        frame.src = url;
        frame.style.display = 'block';
        fallback.style.display = 'none';
      });
    </script>
  </body>
</html>
